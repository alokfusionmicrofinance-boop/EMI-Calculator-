<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Loan EMI Finder</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b6b57">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#f4f6f5;--fg:#13231f;--mut:#5b6b66;--card:#fff;--bd:#cfd8d4;--acc:#0b6b57;--accfg:#fff;--warn:#9a5b00;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1714;--fg:#eaf2ef;--mut:#9db0a9;--card:#17231f;--bd:#2c3d37;--acc:#3ecf9f;--accfg:#06241b;--warn:#f0b24d;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1714;--fg:#eaf2ef;--mut:#9db0a9;--card:#17231f;--bd:#2c3d37;--acc:#3ecf9f;--accfg:#06241b;--warn:#f0b24d;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:12px;max-width:560px;margin-inline:auto}
h1{font-size:20px;margin:4px 0 12px}
h2{font-size:14px;color:var(--mut);margin:14px 0 6px;font-weight:600}
.row{display:flex;flex-wrap:wrap;gap:8px}
button{font:inherit;border:1.5px solid var(--bd);background:var(--card);color:var(--fg);border-radius:10px;padding:10px 14px;min-height:44px}
button.on{background:var(--acc);color:var(--accfg);border-color:var(--acc);font-weight:700}
button:disabled{opacity:.35}
button:focus-visible,input:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
#amts button{flex:1 0 27%;font-size:17px}
.card{background:var(--card);border:1.5px solid var(--acc);border-radius:14px;padding:14px;margin-top:10px}
.big{font-size:34px;font-weight:800;color:var(--acc);line-height:1.1}
.sub{color:var(--mut);margin:2px 0 10px}
.g{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px}
.g div span{display:block;color:var(--mut);font-size:13px}
.g div b{font-size:17px}
.w{color:var(--warn);font-size:13px;margin-top:8px}
input{font:inherit;width:100%;padding:12px;border:1.5px solid var(--bd);border-radius:10px;background:var(--card);color:var(--fg);min-height:48px}
.bl button{display:flex;justify-content:space-between;width:100%;margin-top:6px;text-align:left}
.mut{color:var(--mut)}
.tag{font-weight:700;color:var(--mut);margin-bottom:4px}
.diff{color:var(--warn);font-weight:600;margin:10px 0 0}
</style>
</head>
<body>

<h2>Product</h2><div class="row" id="prod"></div>

<div id="out"></div>
<h2>Customer can pay per instalment (₹)</h2>
<input id="bud" type="number" inputmode="numeric" placeholder="e.g. 2000">
<div class="bl" id="bl"></div>

};
let c="Existing",p="IGL",amt=null;
const $=id=>document.getElementById(id);
const N=n=>n.toLocaleString("en-IN");
const data=()=>p==="IGL"?D["IGL"+c]:D[p];
const sets=()=>p==="IGL"&&c==="Existing"?[["Printed chart",D.IGLExisting],["New sheet",D.IGLExisting2]]:[[null,data()]];
function card(r,d,lb){
  const [a,ti,n,e,l,f,i,w,x]=r;
  return `<div class="card">${lb?`<div class="tag">${lb} · ${d.rate}</div>`:""}<div class="big">₹${N(e)}</div>
  <div class="sub">EMI × ${n} instalments, every ${d.days} days</div>
  <div class="g">
  <div><span>Loan amount</span><b>₹${N(a)}</b></div>
  <div><span>Last instalment</span><b>₹${N(l)}</b></div>
  <div><span>Total interest</span><b>₹${N(ti)}</b></div>
  <div><span>Interest rate</span><b>${d.rate}</b></div>
  <div><span>LPF (1.45% + GST)</span><b>₹${N(f)}</b></div>
  <div><span>Insurance (Kotak)</span><b>₹${N(i)}</b></div>
  <div><span>Total to repay</span><b>₹${N(a+ti)}</b></div>
  <div><span>Tenure</span><b>${n} months</b></div></div>
  ${x?`<div class="sub" style="margin:10px 0 0">Insurance choices: Bajaj ₹${N(x[0])} · HDFC ₹${N(x[1])} · Kotak ₹${N(i)} · ICICI ₹${N(x[2])}</div>`:""}
  ${w?'<div class="w">LPF and insurance on this row were hidden by glare in the photo. Check them on the paper chart.</div>':""}</div>`;
}
function render(){
  $("cust").innerHTML=["New","Existing"].map(x=>`<button class="${x===c?"on":""}" data-c="${x}">${x} customer</button>`).join("");
  $("prod").innerHTML=["IGL","Topup","Ujala"].map(x=>`<button class="${x===p?"on":""}" data-p="${x}" ${c==="New"&&x!=="IGL"?"disabled":""}>${x}</button>`).join("");
  const S=sets(),amts=[...new Set(S.flatMap(([,d])=>d.rows.map(r=>r[0])))].sort((a,b)=>a-b);
  if(!amts.includes(amt))amt=null;
  $("amts").innerHTML=amts.map(a=>`<button class="${a===amt?"on":""}" data-a="${a}">${N(a)}</button>`).join("");
  const out=S.flatMap(([lb,d])=>d.rows.filter(r=>r[0]===amt).map(r=>card(r,d,lb)));
  let note="";
  if(amt&&S.length>1){
    const k=d=>JSON.stringify(d.rows.filter(r=>r[0]===amt).map(r=>[r[2],r[3]]));
    if(!S[1][1].rows.some(r=>r[0]===amt))note='<p class="mut">New sheet has no data for this amount yet, so only the printed chart is shown.</p>';
    else if(k(S[0][1])!==k(S[1][1]))note='<p class="diff">The two charts give different EMIs for this amount. Confirm with your branch before quoting.</p>';
  }
  $("out").innerHTML=out.length?out.join("")+note:'<p class="mut">Tap a loan amount to see the EMI.</p>';
  bud();
}
function bud(){
  const b=+$("bud").value;
  if(!b){$("bl").innerHTML="";return}
  const m=sets().flatMap(([lb,d])=>d.rows.filter(r=>r[3]<=b).map(r=>[r,lb])).sort((x,y)=>y[0][0]-x[0][0]||x[0][3]-y[0][3]).slice(0,10);
  $("bl").innerHTML=m.length?m.map(([r,lb])=>`<button data-a="${r[0]}"><span>₹${N(r[0])}${lb?" · "+lb:""}</span><b>EMI ₹${N(r[3])} × ${r[2]}</b></button>`).join(""):'<p class="mut">No loan fits this EMI for the selected customer and product.</p>';
}
document.addEventListener("click",e=>{
  const t=e.target.closest("button");if(!t)return;
  if(t.dataset.c){c=t.dataset.c;if(c==="New")p="IGL"}
  else if(t.dataset.p)p=t.dataset.p;
  else if(t.dataset.a){amt=+t.dataset.a;render();$("out").scrollIntoView({block:"nearest"});return}
  render();
});
$("bud").addEventListener("input",bud);
render();
if("serviceWorker" in navigator){window.addEventListener("load",()=>{try{navigator.serviceWorker.register("sw.js")}catch(e){}})}

</body>
</html>
